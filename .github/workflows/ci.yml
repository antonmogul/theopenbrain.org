# Quality gate for pull requests and the main branches.
#
# Deliberately scoped to things that are true today, so the gate stays green and
# therefore stays meaningful. It runs: format check, lint, unit tests, build.
#
# It does NOT run Cypress E2E. The 3 specs in cypress/e2e/ are fully
# cy.intercept-stubbed and set a mock session in localStorage, so they need no
# Supabase or secrets — only the preview server. Run against the production
# build on 2026-09-02 (`npm run test:e2e:ci`): 11 of 49 tests pass
# (flashcard 10/20, quiz 1/11, student-dashboard 0/18). The auth mock works —
# whole flashcard study sessions pass — but the rest assert UI text, test ids
# and endpoints the current app no longer renders or calls ("Recent Quiz
# Scores", "Quiz Complete", notes-toggle, course_enrollments…). That is spec
# drift, not infrastructure; a red-by-default pipeline is worse than none.
# Bringing the specs back in line with the UI is tracked separately.
name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

# A new push to the same PR cancels the previous run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          # Storybook 10 needs Node 20.19+. Keep CI on the same patch release
          # as .nvmrc so local and hosted builds exercise one runtime.
          node-version: 20.20.0
          cache: npm

      # The dependency tree has known peer conflicts (the project's own
      # `npm run clean` uses the same flag), so a plain `npm ci` fails.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Chromium only — the smoke test doesn't check cross-browser rendering,
      # and pulling all three engines roughly triples this step.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Check formatting
        run: npm run format:check

      # 0 errors today. --max-warnings=21 against 16 actual (OPENBRAIN-23 took
      # it from 120/107): fails on any new error immediately, and on more than
      # a handful of new warnings. Ratchet it down in package.json as the
      # remaining debt listed in .eslintrc.js is paid off.
      - name: Lint
        run: npm run lint:ci

      # Layering rules from .dependency-cruiser.cjs: no cycles, and stores/,
      # composables/, components/ never import from views/. Exits non-zero only
      # on rule errors; orphan modules are reported as warnings and do not fail
      # the step. Baseline and refresh commands: docs/architecture/README.md.
      - name: Check module graph
        run: npm run graph:check

      - name: Unit tests
        run: npm run test:ci

      # Add VITE_SUPABASE_URL and VITE_SUPABASE_PUBLISHABLE_KEY as repository
      # secrets to turn on the smoke test's chapter-content assertions. Without
      # them the build still succeeds, but chapter routes render only the SPA
      # shell, so the smoke test drops content checks and keeps structural ones.
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      # Storybook is part of the frontend delivery surface, not optional docs.
      # Its Vite graph is different from the app build, so both must compile.
      - name: Check Storybook component coverage
        run: npm run storybook:coverage

      - name: Build Storybook
        run: npm run build-storybook

      # Mount every executable story against the static build. The harness
      # rejects unexpected console errors and any request leaving localhost.
      - name: Smoke test every Storybook story
        run: npm run storybook:smoke:ci

      # A production build that scrolls sideways or throws on load is the class
      # of bug unit tests miss — see OPENBRAIN-4, where the reader scrolled
      # horizontally at every desktop width and nothing caught it.
      - name: Smoke test the production build
        run: npm run test:smoke
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Upload smoke artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: .smoke/
          retention-days: 7
          if-no-files-found: ignore
