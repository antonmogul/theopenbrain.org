name: History fixture browser QA

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: history-fixture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  history-fixture-browser:
    name: History fixture Chromium assertions and screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Storybook aliases every API/auth client. No repository secrets are used.
      STORYBOOK_DISABLE_TELEMETRY: "1"
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20.20.0
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      # The fixture is a dated export of the published chapter
      # (docs/architecture/history-fixture.md). This lane has no secrets and
      # never reads the database: it checks the committed file's shape. Drift
      # from the live chapter is `npm run history:fixture:drift`, run locally.
      - name: Check the committed History fixture's header, counts and links
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p history-fixture-browser-artifacts
          npx vitest run src/__tests__/historyFullReaderFixture.test.js 2>&1 | tee history-fixture-browser-artifacts/fixture-shape.log
      - name: Exercise the History migration replay and source-repair, trending, decks and storage SQL in an isolated temporary database
        shell: bash
        run: |
          set -euo pipefail
          harness="$(mktemp -d)"
          npm install --prefix "$harness" --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.5.8
          export HISTORY_SQL_HARNESS="$harness/node_modules/@electric-sql/pglite"
          npx vitest run --pool=forks src/__tests__/historyMigrationReplay.sql.test.js src/__tests__/historyPenfieldBinder.sql.test.js src/__tests__/historyLoewiKicker.sql.test.js src/__tests__/historySourceContent.test.js src/__tests__/historySourceRepair.sql.test.js src/__tests__/historyReferenceLinks.test.js src/__tests__/historyReferenceLinks.sql.test.js src/__tests__/trendingHighlightsSync.sql.test.js src/__tests__/decks.sql.test.js src/__tests__/chapterMediaListing.sql.test.js 2>&1 | tee history-fixture-browser-artifacts/isolated-sql.log
      - name: Install hosted Chromium
        # The system packages come from Ubuntu's archive. When a runner cannot
        # reach it (11 Nov 2026: every job retried for twenty minutes, then
        # failed), install the browser alone. The runner image already carries
        # the libraries headless Chromium needs, and a missing one fails the
        # first browser step loudly rather than passing by accident.
        run: |
          if curl -fsSI --max-time 15 http://azure.archive.ubuntu.com/ubuntu/ > /dev/null; then
            npx playwright install --with-deps chromium
          else
            echo "::warning::Ubuntu's archive is unreachable; installing Chromium without system packages"
            npx playwright install chromium
          fi
      - name: Build isolated Storybook fixtures
        shell: bash
        run: npm run build-storybook 2>&1 | tee history-fixture-browser-artifacts/storybook-build.log
      - name: Supply and verify local History artwork
        shell: bash
        run: npm run history:fixture:prepare 2>&1 | tee history-fixture-browser-artifacts/fixture-assets.log
      - name: Supply and verify complete reader artwork
        id: prepare-full-reader
        shell: bash
        run: node scripts/history-full-reader-prepare.mjs 2>&1 | tee history-fixture-browser-artifacts/full-reader-assets.log
      - name: Run fixture-only browser assertions
        shell: bash
        run: npm run history:fixture:browser:ci 2>&1 | tee history-fixture-browser-artifacts/browser.log
      - name: Run complete reader fixture assertions
        if: ${{ !cancelled() && steps.prepare-full-reader.outcome == 'success' }}
        shell: bash
        run: npx start-server-and-test 'serve storybook-static -c ../.storybook/serve.json -l tcp://127.0.0.1:6010' http://127.0.0.1:6010 'node scripts/history-full-reader-browser.mjs' 2>&1 | tee history-fixture-browser-artifacts/full-reader-browser.log
      - name: Upload screenshots, measurements and failure context
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: history-fixture-browser-${{ github.sha }}
          path: history-fixture-browser-artifacts/
          retention-days: 14
          if-no-files-found: error
