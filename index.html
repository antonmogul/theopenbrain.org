<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Content-Security-Policy (first pass, deliberately permissive — see
      docs/audit-fixes/STATUS.md#task-4 for tightening plan).
      'unsafe-inline' in script-src is required by the pre-paint prefs script
      below; replace with a hash/nonce when moving to a host-header CSP.
      'wasm-unsafe-eval' (script-src) + blob: (connect-src) exist for
      model-viewer on the /phrenology-3d prototype and apply GLOBALLY — a
      deliberate, accepted trade-off while the 3D route is evaluated
      (OPENBRAIN-7). If the 2D phrenology view ships instead, remove both.
      Note the GLB now uses KHR_mesh_quantization (no draco/meshopt decoder),
      so no CDN decoder hosts are needed in this CSP.
      frame-ancestors/report-uri are not supported in <meta> — set those at the
      hosting layer.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.supabase.co https://i.ytimg.com; media-src 'self' blob: https://*.supabase.co; connect-src 'self' blob: https://*.supabase.co wss://*.supabase.co; font-src 'self' data:; worker-src 'self' blob:; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/favicon_io/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon_io/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon_io/favicon-16x16.png"
    />
    <link rel="manifest" href="/favicon_io/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Open Brain – The Retina</title>
    <script>
      // Apply theme/accent/font-pair attributes and reading-size/line-length CSS
      // variables before CSS loads so first paint matches user prefs.
      // Maps must stay in sync with src/composables/usePreferences.js.
      // data-chapter is deliberately NOT set here: it is route-derived, owned by
      // the router afterEach hook (src/helper/chapterTheme.js) — don't add it.
      (function () {
        try {
          var d = document.documentElement;
          // Dark mode + font choice are disabled (2026-06-30). Pin to the
          // originals here too so returning users with a stale "dark" / font
          // value in localStorage don't flash before usePreferences runs. Stored
          // values are left untouched so the features can be revived later.
          d.dataset.theme = "light";
          d.dataset.accent = localStorage.getItem("ob.accent") || "magenta";
          d.dataset.fontpair = "ibm-plex-legacy";
          var rm = localStorage.getItem("ob.reduceMotion");
          if (rm === "on") d.dataset.reduceMotion = "1";

          var sizeScale = { compact: 0.95, regular: 1, comfortable: 1.1 };
          var measureMap = { tight: "64ch", standard: "72ch", wide: "80ch" };
          var size = localStorage.getItem("ob.typeSize") || "regular";
          var measure = localStorage.getItem("ob.lineLength") || "standard";
          d.style.setProperty("--reading-size", String(sizeScale[size] || 1));
          d.style.setProperty(
            "--reading-measure",
            measureMap[measure] || "72ch"
          );
        } catch (e) {
          /* private mode / disabled storage — skip */
        }
      })();
    </script>
  </head>
  <body>
    <!-- w-full, not w-screen: 100vw includes the scrollbar gutter, so on any
         scrolling page the whole app sat ~15px wider than the viewport and the
         document scrolled horizontally. w-full fills <body> exactly. -->
    <div id="app" class="w-full"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
