<!--
  Storybook manager <head> (OPENBRAIN-115): the IBM Plex faces the themed
  chrome uses (Sans 400/600, Mono 400/500, Latin-1), copied from the app's
  pruned src/ibm-plex.css. They load from /publicAssets on the app's domain, so
  the deployed Storybook (/storybook) gets them; a local run falls back to the
  system font.
-->
<style>
  @font-face {
    font-family: "IBM Plex Mono";
    font-style: normal;
    font-weight: 500;
    src:
      local("IBM Plex Mono Medm"),
      local("IBMPlexMono-Medm"),
      url("/publicAssets/fonts/IBM-Plex/IBM-Plex-Mono/fonts/split/woff2/IBMPlexMono-Medium-Latin1.woff2")
        format("woff2");
    unicode-range:
      U+0000, U+000D, U+0020-007E, U+00A0-00A3, U+00A4-00FF, U+0131,
      U+0152-0153, U+02C6, U+02DA, U+02DC, U+2013-2014, U+2018-201A,
      U+201C-201E, U+2020-2022, U+2026, U+2030, U+2039-203A, U+2044, U+2074,
      U+20AC, U+2122, U+2212, U+FB01-FB02;
  }
  @font-face {
    font-family: "IBM Plex Mono";
    font-style: normal;
    font-weight: 400;
    src:
      local("IBM Plex Mono"),
      local("IBMPlexMono"),
      url("/publicAssets/fonts/IBM-Plex/IBM-Plex-Mono/fonts/split/woff2/IBMPlexMono-Regular-Latin1.woff2")
        format("woff2");
    unicode-range:
      U+0000, U+000D, U+0020-007E, U+00A0-00A3, U+00A4-00FF, U+0131,
      U+0152-0153, U+02C6, U+02DA, U+02DC, U+2013-2014, U+2018-201A,
      U+201C-201E, U+2020-2022, U+2026, U+2030, U+2039-203A, U+2044, U+2074,
      U+20AC, U+2122, U+2212, U+FB01-FB02;
  }
  @font-face {
    font-family: "IBM Plex Sans";
    font-style: normal;
    font-weight: 400;
    src:
      local("IBM Plex Sans"),
      local("IBMPlexSans"),
      url("/publicAssets/fonts/IBM-Plex/IBM-Plex-Sans/fonts/split/woff2/IBMPlexSans-Regular-Latin1.woff2")
        format("woff2");
    unicode-range:
      U+0000, U+000D, U+0020-007E, U+00A0-00A3, U+00A4-00FF, U+0131,
      U+0152-0153, U+02C6, U+02DA, U+02DC, U+2013-2014, U+2018-201A,
      U+201C-201E, U+2020-2022, U+2026, U+2030, U+2039-203A, U+2044, U+2074,
      U+20AC, U+2122, U+2212, U+FB01-FB02;
  }
  @font-face {
    font-family: "IBM Plex Sans";
    font-style: normal;
    font-weight: 600;
    src:
      local("IBM Plex Sans SmBld"),
      local("IBMPlexSans-SmBld"),
      url("/publicAssets/fonts/IBM-Plex/IBM-Plex-Sans/fonts/split/woff2/IBMPlexSans-SemiBold-Latin1.woff2")
        format("woff2");
    unicode-range:
      U+0000, U+000D, U+0020-007E, U+00A0-00A3, U+00A4-00FF, U+0131,
      U+0152-0153, U+02C6, U+02DA, U+02DC, U+2013-2014, U+2018-201A,
      U+201C-201E, U+2020-2022, U+2026, U+2030, U+2039-203A, U+2044, U+2074,
      U+20AC, U+2122, U+2212, U+FB01-FB02;
  }
</style>
