  :root {
    --tob-stage: var(--ob-plate, #333333);      /* fullDa */
    --tob-steps: var(--ob-plate-2, #424242);      /* fullMed */
    --tob-accent: var(--ob-accent, #CC01BE);     /* fullHDa: caption bar, hover */
    --tob-highlight: var(--ob-accent, #00D9B8);  /* primaryMed: highlighted molecules, active legend entry */
    --tob-line: var(--ob-line-plate, rgba(255, 255, 255, .22));
    --tob-left: 58px;          /* left gutter of the stage column (5.8rem on the original site) */
    --tob-sans: var(--ob-font-sans, "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif);
    --tob-mono: var(--ob-font-mono, "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  html, body { margin: 0; background: var(--tob-stage); }
  body { color: #fff; font-family: var(--tob-mono); letter-spacing: .6px; -webkit-font-smoothing: antialiased; hyphens: none; }
  button {
    font: inherit; letter-spacing: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; text-align: left;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  button:focus-visible { outline: 2px solid var(--tob-highlight); outline-offset: 2px; }
  ol, ul { list-style: none; margin: 0; padding: 0; }

  /* two columns: [ animation + legend ] [ steps ] */
  .tob { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); }

  /* ---------- column 1: stage ---------- */
  .tob-stage { background: var(--tob-stage); border-right: 1px solid #fff; min-width: 0; display: flex; flex-direction: column; }
  .tob-head { padding: 22px var(--tob-left) 14px; display: flex; flex-direction: column; align-items: flex-start; gap: 14px; }
  .tob-title { margin: 0; font: 700 19px/30px var(--tob-sans); }
  .tob-icon {
    position: relative; display: grid; place-items: center; border-radius: 50%;
    background: #fff; border: 1px solid #222; flex: none;
    transition: background-color .15s, transform .3s;
  }
  .tob-icon::after { content: ""; position: absolute; inset: -8px; }   /* larger touch target */
  .tob-icon svg { width: 100%; height: 100%; fill: #000; transition: fill .15s; }
  .tob-tools { display: flex; gap: 14px; align-items: center; }
  /* condition switch (e.g. Dark / Light), shown only by widgets that have more than one animation */
  .tob-seg { display: flex; border: 1px solid rgba(255, 255, 255, .55); border-radius: 17px; overflow: hidden; margin-right: 6px; }
  .tob-seg[hidden] { display: none; }
  .tob-seg button { min-height: 32px; padding: 0 16px; font: 700 14px/1 var(--tob-sans); text-align: center; transition: background-color .15s, color .15s; }
  .tob-seg button[aria-pressed="true"] { background: #fff; color: #222; }
  .tob-anim { width: 100%; height: 100%; }
  .tob-anim[hidden] { display: none; }
  .tob-info-btn, .tob-narr-btn { width: 32px; height: 32px; }   /* whole pixels, so the drawing below starts on a pixel boundary */
  .tob-narr-btn .ln { fill: none; stroke: #000; stroke-width: 1.3; stroke-linecap: round; transition: stroke .15s; }
  .tob-narr-btn .off { stroke: #000; stroke-width: 1.3; stroke-linecap: round; }
  .tob-narr-btn[aria-pressed="true"] { background: var(--tob-accent); border-color: #fff; }
  .tob-narr-btn[aria-pressed="true"] svg { fill: var(--ob-on-accent, #fff); }
  .tob-narr-btn[aria-pressed="true"] .ln { stroke: var(--ob-on-accent, #fff); }
  .tob-narr-btn[aria-pressed="true"] .off, .tob-narr-btn[aria-pressed="false"] .ln { display: none; }
  .tob-narr-btn.is-speaking { animation: tob-pulse 1.2s ease-in-out infinite; }
  @keyframes tob-pulse { 50% { box-shadow: 0 0 0 5px rgba(204, 1, 190, .35); } }
  .tob-info-open .tob-info-btn { transform: rotate(45deg); }
  .tob-body { position: relative; flex: 1; display: flex; flex-direction: column; }
  .tob-caption {
    background: var(--tob-accent);
    display: flex; justify-content: space-between; align-items: flex-start; gap: 16px;
    padding: 10px 15px 10px var(--tob-left);
    font: 400 19px/30px var(--tob-sans);
    color: var(--ob-on-accent, #fff);
  }
  .tob-caption-text { padding: 5px 0 5px 2.5px; max-width: 780px; min-height: 40px; }
  .tob-nav { display: flex; align-items: center; gap: 10px; flex: none; }
  .tob-count { font: 400 13px/1 var(--tob-mono); white-space: nowrap; padding-right: 4px; opacity: .9; }
  .tob-ctl { width: 40px; height: 40px; }
  .tob-next svg { transform: rotate(-90deg); }
  .tob-prev svg { transform: rotate(90deg); }
  .tob-pause .i-play, .tob-pause[aria-pressed="true"] .i-pause { display: none; }
  .tob-pause[aria-pressed="true"] .i-play { display: inline; }
  /* the animation: as wide as the column, but never so tall that caption + animation + legend leave the frame */
  .tob-canvas { width: 100%; padding: 14px 20px 10px var(--tob-left); height: 420px; /* refined by applyFraming() */ }
  .tob-canvas svg { display: block; width: 100%; height: 100%; }

  /* legend: directly under the animation it controls */
  .tob-legend { border-top: 1px solid var(--tob-line); padding: 12px 20px 16px var(--tob-left); font: 700 13px/16px var(--tob-mono); }
  .tob-legend ul { display: flex; flex-wrap: wrap; gap: 8px; }
  /* each entry is drawn as a button so it reads as something to press */
  .tob-chip {
    display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 6px 14px 6px 10px;
    border: 1px solid rgba(255, 255, 255, .38); border-radius: 22px; background: rgba(255, 255, 255, .05);
    transition: color .15s, background-color .15s, border-color .15s, opacity .2s;
  }
  .tob-chip[aria-pressed="true"] { color: var(--tob-highlight); border-color: var(--tob-highlight); background: rgba(0, 0, 0, .3); }
  .tob-chip.is-absent { opacity: .38; border-style: dashed; }   /* not in the picture during this step */
  .tob-chip[aria-pressed="true"] .tob-chip-label { text-decoration: underline; text-underline-offset: 3px; }
  .tob-chip svg { width: 25px; height: 25px; flex: none; fill: #fff; color: #fff; }
  .tob-chip sup { position: relative; top: -.5em; font-size: 80%; vertical-align: baseline; }

  /* Highlight outline (see "highlight outline" in the script): drawn in an overlay SVG on its own layer. */
  .tob-canvas { position: relative; }
  /* name tag that travels with a molecule whose identity changes along the way (see cfg.followLabel) */
  .tob-follow {
    position: absolute; left: 0; top: 0; z-index: 2; pointer-events: none; white-space: nowrap; will-change: transform;
    font: 700 12px/1 var(--tob-mono); color: #fff; background: rgba(0, 0, 0, .78); padding: 5px 8px; border-radius: 4px;
  }
  .tob-follow[hidden] { display: none; }
  .tob-overlay { position: absolute; z-index: 1; pointer-events: none; will-change: transform; overflow: visible; }
  .tob-halo path {
    fill: none !important;
    stroke: var(--tob-highlight) !important; stroke-opacity: 1 !important;
    stroke-width: 6px !important; stroke-linejoin: round; stroke-linecap: round;   /* the outer half is what shows */
    vector-effect: non-scaling-stroke;   /* same thickness on screen at every size */
  }
  .tob-sil path { fill-opacity: 1 !important; stroke-opacity: 1 !important; }

  /* info text (the "+" panel) */
  .tob-info { position: absolute; inset: 0; z-index: 5; overflow-y: auto; display: none; padding: 12px 20px 40px var(--tob-left); -webkit-overflow-scrolling: touch; }
  .tob-info p { margin: 0; max-width: 780px; font: 400 19px/30px var(--tob-sans); }
  .tob-info sup { font-size: 58%; font-family: var(--tob-mono); vertical-align: baseline; position: relative; top: -.9em; padding-left: 2px; }  /* footnote numbers */
  .tob-info sup.ch { font-size: 80%; font-family: inherit; top: -.5em; padding-left: 0; }  /* ion charges */
  .tob-info-open .tob-info { display: block; }
  .tob-dim { transition: opacity .3s, filter .3s; }
  .tob-info-open .tob-dim { opacity: .1; filter: blur(4px); pointer-events: none; }

  /* numbered step buttons: phones only, where they replace the written-out list */
  .tob-dots { display: none; }
  .tob-dot {
    flex: 1 1 0; min-width: 0; height: 44px; border-radius: 22px; text-align: center;
    border: 1px solid rgba(255, 255, 255, .38); background: rgba(255, 255, 255, .05);
    font: 700 15px/1 var(--tob-mono); letter-spacing: 0;
    transition: background-color .15s, border-color .15s;
  }
  .tob-dot[aria-current="step"] { background: var(--tob-accent); border-color: #fff; color: var(--ob-on-accent, #fff); }

  /* ---------- column 2: steps ---------- */
  .tob-steps { background: var(--tob-steps); padding-top: 24px; min-width: 0; font: 400 15px/22px var(--tob-mono); }
  .tob-step { display: flex; flex-direction: column; width: 100%; padding: 8px 40px 12px 16px; border-left: 4px solid transparent; transition: color .15s, background-color .2s, border-color .2s; }
  .tob-step-num { opacity: .7; }
  .tob-step[aria-current="step"] { border-left-color: var(--tob-accent); background: rgba(0, 0, 0, .22); }
  .tob-step[aria-current="step"] .tob-step-num { opacity: 1; color: #FF6BF3; font-weight: 700; }

  /* hover feedback only where there is a real pointer (avoids "stuck" hover after a tap) */
  @media (hover: hover) {
    .tob-ctl:hover { background: #222; border-color: #fff; }
    .tob-ctl:hover svg { fill: #fff; }
    .tob-chip:hover { border-color: var(--tob-highlight); }
    .tob-seg button[aria-pressed="false"]:hover { background: rgba(255, 255, 255, .16); }
    .tob-step:hover { color: var(--tob-accent); }
    .tob-chip:hover { color: var(--tob-highlight); }
  }
  .tob-ctl:active { background: #222; border-color: #fff; }
  .tob-ctl:active svg { fill: #fff; }
  .tob-step:active { color: var(--tob-accent); }

  /* touch screens: finger-sized arrow */
  @media (pointer: coarse) { .tob-ctl { width: 44px; height: 44px; } .tob-seg { border-radius: 22px; } .tob-seg button { min-height: 44px; padding: 0 18px; } }

  /* ---------- tablets / small laptops ---------- */
  @media (max-width: 1100px) {
    :root { --tob-left: 24px; }
    .tob { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); }
    .tob-head { padding-top: 16px; gap: 10px; }
    .tob-caption { font-size: 17px; line-height: 26px; }
    .tob-info p { font-size: 17px; line-height: 27px; }
    .tob-steps { font-size: 14px; line-height: 21px; padding-top: 16px; }
    .tob-step { padding: 8px 20px 12px 14px; }
  }

  /* ---------- phones: one column; steps follow the animation and legend ---------- */
  @media (max-width: 700px) {
    :root { --tob-left: 16px; }
    .tob-halo path { stroke-width: 4px !important; }
    .tob { display: block; }
    .tob-stage { border-right: 0; }
    .tob-head { flex-direction: row; flex-wrap: wrap; align-items: center; justify-content: space-between; padding: 12px var(--tob-left); }
    .tob-canvas { padding: 12px var(--tob-left) 8px; }
    .tob-caption { flex-wrap: wrap; gap: 8px 16px; padding-right: var(--tob-left); }
    .tob-caption-text { flex: 1 1 100%; min-height: 0; padding: 2px 0 0; }
    .tob-nav { flex: 1 1 100%; justify-content: flex-end; }
    .tob-count { display: none; }   /* the numbered buttons show the position */
    .tob-dots { display: flex; gap: 4px; padding: 10px var(--tob-left) 2px; }
    .tob-steps { display: none; }
    .tob-legend { padding: 10px var(--tob-left) 14px; }
    .tob-legend ul { gap: 6px; }
    .tob-chip { padding: 6px 12px 6px 8px; gap: 8px; }
    .tob-chip svg { width: 22px; height: 22px; }
    .tob-info { position: static; padding: 14px var(--tob-left) 24px; overflow: visible; }
    .tob-info-open .tob-caption, .tob-info-open .tob-dots, .tob-info-open .tob-canvas, .tob-info-open .tob-legend { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .tob-icon, .tob-dim, .tob-step, .tob-chip, .tob-dot, .tob-seg button { transition: none; }
    .tob-narr-btn.is-speaking { animation: none; }
  }

  /* =====================================================================================================
     "Site" theme (class "tob-site" on <html>): the look of the original site's in-page animations, for widgets
     that take half a page. Light grey page background, black text and icons, teal for whatever is active, the
     caption in a white box with a teal border. One column, no step list, the animation as large as it will go.
     ===================================================================================================== */
  html.tob-site {
    --tob-stage: #F3F4F6;      /* the site's page background */
    --tob-accent: var(--ob-accent, #00D9B8);     /* primaryMed; the chapter colour inside the book */
    --tob-highlight: var(--ob-accent, #00D9B8);
    --tob-line: rgba(0, 0, 0, .25);
    --tob-left: 20px;
  }
  html.tob-site body { color: #000; }
  html.tob-site button:focus-visible { outline-color: #000; }
  html.tob-site .tob { display: block; }
  html.tob-site .tob-stage { border-right: 0; }
  html.tob-site .tob-steps, html.tob-site .tob-dots { display: none; }
  html.tob-site .tob-head { flex-direction: row; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; padding: 14px var(--tob-left) 10px; }
  /* Dark / Light: rectangular blocks, the active one filled teal, as on the site */
  html.tob-site .tob-seg { border: 0; border-radius: 0; overflow: visible; gap: 8px; margin-right: 8px; }
  html.tob-site .tob-seg button { border: 1px solid #000; min-width: 86px; min-height: 32px; padding: 0 14px; font: 400 12px/1 var(--tob-mono); letter-spacing: .6px; }
  html.tob-site .tob-seg button[aria-pressed="true"] { background: var(--tob-highlight); border-color: var(--tob-highlight); color: #000; font-weight: 600; }
  html.tob-site .tob-narr-btn[aria-pressed="true"] { background: var(--tob-highlight); border-color: #000; }
  html.tob-site .tob-narr-btn[aria-pressed="true"] svg { fill: #000; }
  html.tob-site .tob-narr-btn[aria-pressed="true"] .ln { stroke: #000; }
  html.tob-site .tob-narr-btn.is-speaking { animation-name: tob-pulse-site; }
  @keyframes tob-pulse-site { 50% { box-shadow: 0 0 0 5px rgba(0, 217, 184, .55); } }
  /* caption: the site's caption box, white with a teal border */
  html.tob-site .tob-caption {
    margin: 0 var(--tob-left); padding: 8px 8px 8px 14px; align-items: center; gap: 12px;
    background: #fff; color: #000; border: 1px solid var(--tob-highlight); font: 400 13px/19px var(--tob-mono);
  }
  html.tob-site .tob-caption-text { padding: 0; max-width: none; flex: 1 1 auto; }
  html.tob-site .tob-nav { gap: 8px; }
  html.tob-site .tob-count {
    display: block; padding: 6px 9px; border: 1.5px solid var(--tob-highlight); border-radius: 14px; opacity: 1;
    color: #007F6C; font: 600 13px/1 var(--tob-sans); letter-spacing: 0;
  }
  html.tob-site .tob-ctl { width: 34px; height: 34px; }
  html.tob-site .tob-ctl:active { background: var(--tob-highlight); border-color: #000; }
  html.tob-site .tob-ctl:active svg { fill: #000; }
  html.tob-site .tob-canvas { padding: 8px var(--tob-left) 4px; }
  /* legend: black icons and labels, as in the site's legend */
  html.tob-site .tob-legend { border-top: 0; padding: 4px var(--tob-left) 14px; font: 400 12px/16px var(--tob-mono); }
  html.tob-site .tob-legend ul { gap: 6px; }
  html.tob-site .tob-chip { border: 1px solid rgba(0, 0, 0, .55); border-radius: 0; background: transparent; min-height: 36px; padding: 4px 12px 4px 8px; gap: 8px; }
  html.tob-site .tob-chip svg { width: 22px; height: 22px; fill: #000; color: #000; }
  html.tob-site .tob-chip[aria-pressed="true"] { color: #000; border-color: var(--tob-highlight); background: var(--tob-highlight); font-weight: 600; }
  html.tob-site .tob-chip[aria-pressed="true"] .tob-chip-label { text-decoration: none; }
  @media (hover: hover) {
    html.tob-site .tob-ctl:hover { background: var(--tob-highlight); border-color: #000; }
    html.tob-site .tob-ctl:hover svg { fill: #000; }
    html.tob-site .tob-chip:hover { color: #000; border-color: var(--tob-highlight); }
    html.tob-site .tob-seg button[aria-pressed="false"]:hover { background: transparent; border-color: var(--tob-highlight); }
  }
  @media (pointer: coarse) {
    html.tob-site .tob-ctl { width: 44px; height: 44px; }
    html.tob-site .tob-seg button, html.tob-site .tob-chip { min-height: 44px; }
  }
  @media (max-width: 700px) {
    html.tob-site { --tob-left: 14px; }
    html.tob-site .tob-caption { flex-wrap: wrap; gap: 8px 12px; padding: 10px 10px 8px 12px; font-size: 14px; line-height: 20px; }
    html.tob-site .tob-caption-text { flex: 1 1 100%; }
    html.tob-site .tob-nav { flex: 1 1 100%; justify-content: flex-end; }
    html.tob-site .tob-count { margin-right: auto; }
  }

  /* ---------- "hold" widgets (cfg.hold): each step is a still picture, with a switch to a second version of it ---------- */
  .tob-hold .tob-pause { display: none; }
  /* the steps are alternatives, not a sequence: names instead of numbers */
  .tob-hold .tob-step-num, .tob-hold .tob-count { display: none; }
  .tob-hold .tob-dots { flex-wrap: wrap; gap: 6px; }
  .tob-hold .tob-dot { flex: 1 1 auto; width: auto; padding: 0 10px; font: 700 12px/1 var(--tob-sans); letter-spacing: 0; white-space: nowrap; }
  .tob-seg button:disabled { opacity: .4; cursor: default; }

  /* =====================================================================================================
     "Choices" layout (cfg.layout === "choices", class "tob-choices" on <html>): the site's own look for
     Refraction errors. Grey-green page, black text; title, "+" and a block of state buttons on the left (each
     refractive error with a "Corrected" button beside it), the drawing on the right. The explanation opens over
     a dark page, as on the site.
     ===================================================================================================== */
  html.tob-choices { --tob-stage: #8F9E9D; --tob-accent: var(--ob-accent, #00D9B8); --tob-highlight: var(--ob-accent, #00D9B8); --tob-left: 28px; }
  html.tob-choices, html.tob-choices body, html.tob-choices .tob-stage { transition: background-color .3s, color .3s; }
  html.tob-choices body { color: #000; }
  html.tob-choices.tob-dark, html.tob-choices.tob-dark body, html.tob-choices.tob-dark .tob-stage { background: #333; color: #fff; }
  html.tob-choices button:focus-visible { outline-color: #000; }
  html.tob-choices .tob { display: block; }
  html.tob-choices .tob-steps, html.tob-choices .tob-dots, html.tob-choices .tob-seg, html.tob-choices .tob-nav { display: none !important; }
  html.tob-choices .tob-stage {
    position: relative; border-right: 0; display: grid; align-content: start;
    grid-template-columns: minmax(calc(222px + var(--tob-left) + 28px), 1fr) minmax(0, 2fr); padding-bottom: 24px;
    grid-template-rows: auto auto auto 1fr;
  }
  html.tob-choices .tob-body { display: contents; }
  html.tob-choices .tob-head { grid-column: 1; grid-row: 1; padding: 25px 0 16px var(--tob-left); gap: 20px; }
  html.tob-choices .tob-pick { grid-column: 1; grid-row: 2; padding-left: var(--tob-left); width: calc(222px + var(--tob-left)); display: grid; gap: 10px; }
  html.tob-choices .tob-pick-row { display: grid; grid-template-columns: 1fr 1fr; }
  html.tob-choices .tob-pick button {
    min-height: 48px; padding: 6px 8px; border: 1px solid #000; color: #333; text-align: center;
    font: 400 12px/16px var(--tob-mono); letter-spacing: 0; transition: background-color .1s, color .1s, border-color .1s;
  }
  html.tob-choices .tob-pick .is-wide { grid-column: 1 / -1; }
  html.tob-choices .tob-pick .tob-pick-alt { background: #fff; border-left: 0; }
  html.tob-choices .tob-pick button.is-on { background: var(--tob-highlight); color: #000; }
  html.tob-choices .tob-pick button.is-row { color: #000; border-color: var(--tob-highlight); border-right-color: #000; }   /* its "Corrected" is on */
  html.tob-choices .tob-caption {
    grid-column: 1; grid-row: 3; background: none; display: block; margin: 0;
    padding: 18px 0 20px var(--tob-left); width: calc(222px + var(--tob-left)); font: 400 13px/19px var(--tob-mono);
  }
  html.tob-choices .tob-caption-text { padding: 0; min-height: 0; max-width: none; }
  /* on the site the drawing sits in the right two-thirds of the page, 900px wide at most */
  html.tob-choices .tob-view { grid-column: 2; grid-row: 1 / span 4; align-self: center; justify-self: center; min-width: 0; width: 100%; max-width: 928px; }
  html.tob-choices .tob-canvas { padding: 20px 28px 20px 0; background: none !important; }
  html.tob-choices .tob-legend { display: none; }
  /* the explanation is laid over the buttons and drawing but stays in the page flow, so the widget grows to fit
     the whole text and nothing has to be scrolled */
  html.tob-choices .tob-info {
    position: relative; inset: auto; overflow: visible; grid-column: 1 / -1; grid-row: 2 / span 3; align-self: start;
    padding: 24px 28px 30px var(--tob-left); color: #fff;
  }
  html.tob-choices .tob-info p { max-width: 700px; }
  html.tob-choices .tob-info-open .tob-dim { opacity: .15; }
  html.tob-choices .tob-narr-btn[aria-pressed="true"] { background: var(--tob-highlight); border-color: #000; }
  html.tob-choices .tob-narr-btn[aria-pressed="true"] svg { fill: #000; }
  html.tob-choices .tob-narr-btn[aria-pressed="true"] .ln { stroke: #000; }
  html.tob-choices .tob-narr-btn.is-speaking { animation-name: tob-pulse-site; }
  @media (hover: hover) {
    html.tob-choices .tob-pick button:not(.is-on):hover { color: var(--tob-highlight); border-color: var(--tob-highlight); }
    html.tob-choices .tob-icon:hover { background: var(--tob-highlight); }
  }
  @media (max-width: 700px) {
    html.tob-choices { --tob-left: 16px; }
    html.tob-choices .tob-stage { display: block; }
    html.tob-choices .tob-head { flex-direction: column; align-items: flex-start; padding: 16px var(--tob-left) 12px; gap: 12px; }
    html.tob-choices .tob-pick { width: auto; max-width: 340px; padding-right: var(--tob-left); }
    html.tob-choices .tob-caption { width: auto; padding: 14px var(--tob-left) 4px; font-size: 14px; line-height: 20px; }
    html.tob-choices .tob-canvas { padding: 8px var(--tob-left) 16px; }
    html.tob-choices .tob-info { padding: 6px var(--tob-left) 24px; }
    html.tob-choices .tob-info-open .tob-caption, html.tob-choices .tob-info-open .tob-view { display: none; }
    html.tob-choices .tob-info-open .tob-pick { display: none; }
  }

  /* =====================================================================================================
     "Picker" widgets (cfg.picker): a drawing with a list of its parts beside it, as on the site. Choosing a part
     colours it turquoise in the drawing ("single": one at a time, underlined in the list) or shows and hides it
     ("toggle": blocks that start switched on). The colour rules below are the site's own (index.css), applied
     to the classes the artwork carries.
     ===================================================================================================== */
  .tob-picker .tob-pause { display: none; }
  .tob-picker .tob-view { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: start; }
  .tob-picks { padding: 18px 8px 16px var(--tob-left); display: flex; flex-direction: column; align-items: flex-start; font: 400 12px/16px var(--tob-mono); }
  .tob-picks button { display: flex; align-items: center; gap: 10px; min-height: 31px; padding: 4px 0; color: #000; letter-spacing: .6px; }
  .tob-picks button svg { width: 28px; height: 30px; flex: none; margin: 3px 0 3px -4px; color: #000; overflow: visible; }
  .tob-picks button span { padding-bottom: 2px; border-bottom: 4px solid transparent; transition: border-color .15s, color .15s; }
  .tob-picks button[aria-pressed="true"] span { border-bottom-color: var(--tob-highlight); }
  .tob-picker-toggle .tob-picks { gap: 10px; }
  .tob-picker-toggle .tob-picks button {
    flex-direction: column; justify-content: center; gap: 6px; width: 116px; min-height: 76px; padding: 12px 8px 8px;
    border: 1px solid #000; text-align: center; transition: background-color .15s, border-color .15s, color .15s;
  }
  .tob-picker-toggle .tob-picks button svg { width: 84px; height: 38px; margin: 0; }
  .tob-picker-toggle .tob-picks button span { border: 0; padding: 0; }
  .tob-picker-toggle .tob-picks button[aria-pressed="true"] { background: var(--tob-highlight); border-color: var(--tob-highlight); font-weight: 600; }
  @media (hover: hover) {
    .tob-picker-single .tob-picks button:hover { color: var(--tob-highlight); }
    .tob-picker-toggle .tob-picks button:hover { background: #fff; border-color: var(--tob-highlight); color: var(--tob-highlight); }
    .tob-picker-toggle .tob-picks button[aria-pressed="true"]:hover { color: #000; background: var(--tob-highlight); }
  }
  @media (pointer: coarse) { .tob-picker-single .tob-picks button { min-height: 44px; } }
  @media (max-width: 470px) {            /* narrow column or phone: the list goes above the drawing */
    .tob-picker .tob-view { display: block; }
    .tob-picks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 14px; padding: 6px var(--tob-left) 4px; }
    .tob-picker-toggle .tob-picks { display: flex; flex-direction: row; }
    .tob-picker-toggle .tob-picks { gap: 8px; }
    .tob-picker-toggle .tob-picks button { width: auto; flex: 1 1 0; min-width: 0; }
  }
  /* the site's colouring of a chosen part */
  .tob-picker .highlighterIlluFill > g > path, .tob-picker .highlighterIlluStroke > g > path,
  .tob-picker .highlighterIlluFill > path, .tob-picker .highlighterIlluStroke > path { transition: fill .5s, fill-opacity .5s, stroke .5s, stroke-opacity .5s; }
  .tob-picker .highlighterIlluFill.highlightIllu > *, .tob-picker .highlightIllu > .highlighterIlluFill > *,
  .tob-picker .highlightIllu > .highlighterIlluFill, .tob-picker .highlighterIlluFill.highlightIllu > * > *,
  .tob-picker .highlightIllu > *, .tob-picker .highlightIllu > * > *.highlighterIlluFill { fill: var(--tob-highlight); fill-opacity: 1; }
  .tob-picker .highlighterIlluBorder.highlightIllu > *, .tob-picker .highlightIllu > .highlighterIlluBorder > *,
  .tob-picker .highlightIllu > .highlighterIlluBorder, .tob-picker .highlighterIlluBorder.highlightIllu > * > *,
  .tob-picker .highlighterIlluStroke.highlightIllu > *, .tob-picker .highlightIllu > .highlighterIlluStroke > *,
  .tob-picker .highlightIllu > .highlighterIlluStroke, .tob-picker .highlighterIlluStroke.highlightIllu > * > * { stroke: var(--tob-highlight); stroke-width: 3; stroke-opacity: 1; }
  .tob-picker .highlighterDisplay > * { opacity: 0; transition: opacity .5s; }
  .tob-picker .highlighterDisplay.highlightIllu > * { opacity: 1; }
  .tob-picker .highlighterIlluDisplay { opacity: 0; transition: opacity .3s; }
  .tob-picker .highlighterIlluDisplay.active, .tob-picker .highlighterIlluDisplay.highlightIllu { opacity: 1; }

  /* ---------- "plain" widgets (cfg.plain): one continuous loop, no steps or captions; a key to the symbols ---------- */
  .tob-key[hidden] { display: none; }
  .tob-plain .tob-caption, .tob-plain .tob-dots, .tob-plain .tob-steps { display: none !important; }
  .tob-plain .tob-head { padding-bottom: 6px; }
  .tob-plain .tob-tools .tob-ctl { width: 32px; height: 32px; }
  .tob-keyed .tob-view { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; }
  .tob-key { padding: 8px var(--tob-left) 8px 0; font: 400 12px/15px var(--tob-mono); }
  .tob-key ul { display: grid; gap: 9px; }
  .tob-key li { display: flex; align-items: center; gap: 9px; }
  .tob-key svg { width: 55px; height: 25px; flex: none; color: currentColor; overflow: visible; }
  .tob-key-title { font-weight: 600; margin: 0 0 10px; }
  @media (max-width: 470px) {            /* narrow column or phone: the key goes under the animation */
    .tob-keyed .tob-view { display: block; }
    .tob-key { padding: 2px var(--tob-left) 14px; font-size: 11.5px; letter-spacing: 0; }
    .tob-key li { gap: 7px; }
    .tob-key ul { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 10px; }
    .tob-key svg { width: 40px; height: 18px; }
  }
  @media (pointer: coarse) { .tob-plain .tob-tools .tob-ctl { width: 44px; height: 44px; } }
</style>
</head>

<script>
(function () {
  "use strict";
  var cfg = JSON.parse(document.getElementById("tob-config").textContent);
  // A widget has one animation, or several "conditions" (e.g. Dark / Light) that the reader switches between.
  // Each condition has its own animation data, steps and narration; everything else is shared.
  var conds = cfg.conditions || [{ label: null, steps: cfg.steps, loops: cfg.loops, enter: cfg.enter, viewBox: cfg.viewBox,
                                   narration: cfg.narration, narrationAudio: cfg.narrationAudio }];
  conds.forEach(function (c, i) {
    c.data = JSON.parse(document.getElementById("tob-animation" + (i ? "-" + (i + 1) : "")).textContent);
    c.anim = null; c.box = null; c.presence = null; c.players = []; c.loaded = false;
  });
  // the active condition's values (re-pointed by adopt() when the reader switches condition)
  var cond, data, loops, enter, steps, nSteps, anim, narration, clips, players, presence;
  function adopt(c) {
    cond = c; data = c.data; anim = c.anim; presence = c.presence;
    loops = c.loops;                     // step i repeats loops[i][0] -> loops[i][1]
    enter = c.enter;                     // frame to start from when step i is reached from step i - 1
    steps = c.steps; nSteps = steps.length;
    narration = c.narration || []; clips = c.narrationAudio || []; players = c.players;
  }
  var narrow = window.matchMedia ? window.matchMedia("(max-width: 700px)") : { matches: false };
  var single = cfg.layout === "single";  // one column at every width (widgets that take half a page)

  var $ = function (id) { return document.getElementById(id); };
  var root = $("tob-widget");
  var canvas = $("tob-canvas");
  $("tob-title").textContent = cfg.title;
  canvas.setAttribute("aria-label", cfg.title + " animation");

  if (cfg.stageColor) canvas.style.background = cfg.stageColor;
  // "plain" widgets play one continuous loop: no captions or steps, and the pause button moves up beside the switch
  if (cfg.plain) {
    document.documentElement.classList.add("tob-plain");
    document.querySelector(".tob-tools").appendChild($("tob-pause"));
  }
  // key to the symbols used in the drawing (not clickable, unlike the legend)
  if (cfg.key && cfg.key.length) {
    document.documentElement.classList.add("tob-keyed");
    cfg.key.forEach(function (k) {
      var li = document.createElement("li");
      li.innerHTML = (k.icon || "") + "<span>" + k.label + "</span>";
      $("tob-key-list").appendChild(li);
    });
    $("tob-key").hidden = false;
  }
  // list of the drawing's parts (see the "Picker" styles)
  var picker = cfg.picker || null, pickButtons = [], picked = -1;
  function pickParts(i) { return partsOf(picker.items[i].cls); }
  function renderPick() {
    if (!picker) return;
    picker.items.forEach(function (item, i) {
      var on = picker.mode === "toggle" ? !item.off : i === picked;
      pickButtons[i].setAttribute("aria-pressed", String(on));
      pickParts(i).forEach(function (el) { el.classList.toggle(picker.mode === "toggle" ? "active" : "highlightIllu", on); });
    });
  }
  function pick(i) {
    if (picker.mode === "toggle") picker.items[i].off = !picker.items[i].off;
    else picked = (picked === i) ? -1 : i;       // choosing the chosen part again clears it
    renderPick();
  }
  if (picker) {
    document.documentElement.classList.add("tob-picker", "tob-picker-" + picker.mode);
    var picks = document.createElement("div");
    picks.className = "tob-picks"; picks.setAttribute("role", "group");
    picks.setAttribute("aria-label", picker.mode === "toggle" ? "Show or hide in the drawing" : "Highlight in the drawing");
    picker.items.forEach(function (item, i) {
      var b = document.createElement("button");
      b.type = "button"; b.setAttribute("aria-pressed", "false");
      b.innerHTML = (item.icon || "") + "<span>" + item.label + "</span>";
      b.addEventListener("click", function () { pick(i); });
      picks.appendChild(b); pickButtons.push(b);
    });
    canvas.parentNode.insertBefore(picks, canvas);
    // the host page can open the widget with a part already chosen: widget.html?select=bipolar-cells
    var want = (/[?&#]select=([^&#]+)/.exec(location.search + location.hash) || [])[1];
    if (want && picker.mode === "single") {
      var slug = function (s) { return s.toLowerCase().replace(/<[^>]+>/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, ""); };
      picker.items.forEach(function (item, i) { if (slug(item.label) === slug(decodeURIComponent(want))) picked = i; });
    }
  }
  conds.forEach(function (c, i) {
    c.box = document.createElement("div");
    c.box.className = "tob-anim";
    c.box.hidden = i > 0;
    canvas.appendChild(c.box);
    c.anim = lottie.loadAnimation({
      container: c.box,
      renderer: "svg",
      loop: true,                        // as on the original site: the current step repeats until the reader moves on
      autoplay: false,
      animationData: c.data,
      rendererSettings: { progressiveLoad: false, preserveAspectRatio: "xMidYMid meet" }
    });
    c.anim.setSubframe(true);
    if (cfg.speed) c.anim.setSpeed(cfg.speed);
    c.anim.addEventListener("drawnFrame", function () { if (c === cond) { syncHalos(); placeFollow(); } });
  });
  adopt(conds[0]);
  function artSvg() { return cond.box.querySelector("svg"); }
  // frame number in the animation's own timeline (the player counts from the start of the segment being played)
  function absFrame() { return anim.currentFrame + (anim.firstFrame || 0); }
  function inRanges(f, ranges) {
    if (!ranges) return true;
    for (var i = 0; i < ranges.length; i++) if (f >= ranges[i][0] && f < ranges[i][1]) return true;
    return false;
  }
  // every element of the active animation that belongs to a legend entry (an entry may list several class names)
  function partsOf(cls) {
    var out = [], svg = artSvg();
    if (!svg) return out;
    cls.split(" ").forEach(function (c) { if (c) Array.prototype.push.apply(out, svg.getElementsByClassName(c)); });
    return out;
  }

  var current = 0;
  var onScreen = true;

  // ----- steps list (rebuilt when the condition changes) -----
  var stepButtons = [], dotButtons = [];
  function buildSteps() {
  stepButtons = []; dotButtons = [];
  $("tob-steps").textContent = ""; $("tob-dots").textContent = "";
  steps.forEach(function (text, i) {
    var li = document.createElement("li");
    var b = document.createElement("button");
    b.type = "button";
    b.className = "tob-step";
    var n = document.createElement("span");
    n.className = "tob-step-num";
    n.textContent = String(i + 1);
    var t = document.createElement("span");
    t.textContent = text;
    b.appendChild(n); b.appendChild(t);
    b.addEventListener("click", function () { playStep(i, i === current + 1); });
    li.appendChild(b);
    $("tob-steps").appendChild(li);
    stepButtons.push(b);
    // the same step as a numbered button (shown on phones instead of the list)
    var d = document.createElement("button");
    d.type = "button";
    d.className = "tob-dot";
    d.textContent = (cfg.dotLabels && cfg.dotLabels[i]) || String(i + 1);
    d.setAttribute("aria-label", "Step " + (i + 1) + ": " + text);
    d.addEventListener("click", function () { playStep(i, i === current + 1); });
    $("tob-dots").appendChild(d);
    dotButtons.push(d);
  });
  }
  buildSteps();

  // ----- condition switch -----
  var condButtons = [];
  function setCondition(i) {
    if (conds[i] === cond) return;
    stopNarration();
    anim.pause();
    cond.box.hidden = true;
    adopt(conds[i]);
    cond.box.hidden = false;
    condButtons.forEach(function (b, k) { b.setAttribute("aria-pressed", String(k === i)); });
    buildSteps();
    applyFraming();
    if (!cond.presence) { try { computePresence(); } catch (e) { presence = cond.presence = null; } }
    applyHighlight();
    playStep(0);                         // a different condition starts again from its first step
  }
  if (conds.length > 1) {
    conds.forEach(function (c, i) {
      var b = document.createElement("button");
      b.type = "button"; b.textContent = c.label;
      b.setAttribute("aria-pressed", String(i === 0));
      b.addEventListener("click", function () { setCondition(i); });
      $("tob-cond").appendChild(b);
      condButtons.push(b);
    });
    $("tob-cond").hidden = false;
  }

  // ----- "hold" mode: every step is a still picture (cfg.hold[i].at); a switch plays across to a second picture
  // (cfg.hold[i].alt, e.g. the same eye with a corrective lens) and back -----
  var hold = cfg.hold || null, altOn = false, altButtons = [], altPlayers = [];
  function renderAlt() {
    var has = hold[current].alt != null;
    altButtons.forEach(function (b, k) { b.disabled = !has; b.setAttribute("aria-pressed", String(has && (k === 1) === altOn)); });
  }
  function setAlt(on) {
    var h = hold[current];
    if (h.alt == null || on === altOn) return;
    altOn = on;
    renderCaption(); renderAlt();
    anim.loop = false;
    anim.playSegments(on ? [h.at, h.alt] : [h.alt, h.at], true);
    narrate();
  }
  if (hold) {
    document.documentElement.classList.add("tob-hold");
    (cfg.altLabels || ["Off", "On"]).forEach(function (label, k) {
      var b = document.createElement("button");
      b.type = "button"; b.textContent = label;
      b.addEventListener("click", function () { setAlt(k === 1); });
      $("tob-cond").appendChild(b);
      altButtons.push(b);
    });
    $("tob-cond").hidden = false;
  }
  // "choices" layout: the site's block of buttons, one per state, each with its "Corrected" button beside it
  var picks = [];
  function choose(i, alt) {
    if (i === current) { setAlt(alt); return; }      // same state: play the lens in or out
    altOn = alt && hold[i].alt != null;
    playStep(i);
  }
  if (hold && cfg.layout === "choices") {
    document.documentElement.classList.add("tob-choices");
    var pick = document.createElement("div");
    pick.className = "tob-pick tob-dim";
    pick.setAttribute("role", "group"); pick.setAttribute("aria-label", "Eye");
    steps.forEach(function (name, i) {
      var row = document.createElement("div"); row.className = "tob-pick-row";
      var b = document.createElement("button"); b.type = "button"; b.textContent = name;
      b.addEventListener("click", function () { choose(i, false); });
      row.appendChild(b);
      var a = null;
      if (hold[i].alt != null) {
        a = document.createElement("button"); a.type = "button"; a.className = "tob-pick-alt";
        a.textContent = (cfg.altLabels || [])[1] || "On";
        a.setAttribute("aria-label", name + ", " + a.textContent.toLowerCase());
        a.addEventListener("click", function () { choose(i, true); });
        row.appendChild(a);
      } else b.classList.add("is-wide");
      pick.appendChild(row);
      picks.push({ main: b, alt: a });
    });
    var cap = document.querySelector(".tob-caption");
    cap.parentNode.insertBefore(pick, cap);
  }
  function renderPicks() {
    picks.forEach(function (p, i) {
      var here = i === current;
      p.main.classList.toggle("is-on", here && !altOn);
      p.main.classList.toggle("is-row", here && altOn);
      p.main.setAttribute("aria-pressed", String(here && !altOn));
      if (p.alt) { p.alt.classList.toggle("is-on", here && altOn); p.alt.setAttribute("aria-pressed", String(here && altOn)); }
    });
  }
  function captionOf(i, alt) {
    return (alt && cfg.captionsAlt && cfg.captionsAlt[i]) || (cfg.captions && cfg.captions[i]) || steps[i];
  }

  function renderCaption() {
    $("tob-caption-text").textContent = captionOf(current, altOn);
    renderPicks();
    $("tob-count").textContent = (current + 1) + " / " + nSteps;
    $("tob-count").setAttribute("aria-label", "Step " + (current + 1) + " of " + nSteps);
    stepButtons.concat(dotButtons).forEach(function (b, i) {
      if (i % nSteps === current) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current");
    });
    renderPresence();
  }

  // Some changes in the artwork last a single frame and sit exactly on a step boundary (e.g. the voltmeter
  // switching off as step 2 begins). They are transitions between steps, so they are played once when a step
  // is reached from the one before it, and kept out of the repeating part.
  function playStep(i, fromPrevious) {
    current = ((i % nSteps) + nSteps) % nSteps;
    if (hold) {
      if (hold[current].alt == null) altOn = false;
      renderCaption(); renderAlt();
      anim.loop = false;
      anim.resetSegments(true);
      anim.goToAndStop(altOn ? hold[current].alt : hold[current].at, true);
      narrate();
      return;
    }
    renderCaption();
    if (cfg.once) {                      // the drawing assembles itself once, then stays put
      anim.loop = false;
      anim.playSegments(loops[current], true);
      if (!onScreen) anim.pause();
      narrate();
      return;
    }
    var loop = loops[current];
    if (fromPrevious && enter[current] !== loop[0]) anim.playSegments([[enter[current], loop[1]], loop], true);
    else anim.playSegments(loop, true);
    setPaused(false);
    if (!onScreen) anim.pause();
    narrate();
  }

  // ----- pause / resume (moving to another step resumes) -----
  var userPaused = false;
  function setPaused(p) {
    userPaused = p;
    var btn = $("tob-pause"), label = p ? "Play animation" : "Pause animation";
    btn.setAttribute("aria-pressed", String(p));
    btn.setAttribute("aria-label", label); btn.title = label;
  }
  $("tob-pause").addEventListener("click", function () {
    setPaused(!userPaused);
    if (userPaused) anim.pause(); else if (onScreen) anim.play();
  });
  $("tob-prev").addEventListener("click", function () { playStep(current - 1); });

  // ----- optional spoken narration (off until the reader turns it on) -----
  // Plays the clip in cfg.narrationAudio[i] (URL or data: URI) when there is one; otherwise the browser's own
  // text-to-speech voice reads cfg.narration[i]. cfg.narration is also the transcript of the clips.
  var synth = ("speechSynthesis" in window && "SpeechSynthesisUtterance" in window) ? window.speechSynthesis : null;
  var narrBtn = $("tob-narr-btn");
  var narrOn = false, voice = null, player = null;
  // Preferred voice: a British woman. Browsers do not report a voice's gender, so known voice names are
  // matched instead (Windows/Edge, Chrome, macOS/iOS). Order of preference:
  //   1. a known female en-GB voice   2. any en-GB voice that is not a known male one
  //   3. a known female English voice of another accent   4. whatever English voice the device offers
  var GB_FEMALE = /sonia|libby|maisie|hollie|bella|olivia|abbi|mia\b|hazel|susan|google uk english female|kate|serena|martha|stephanie|fiona|flo\b|shelley|sandy|amy|emma|female/i;
  var MALE = /\bmale\b|ryan|george|thomas|oliver|noah|elliot|ethan|alfie|daniel|arthur|malcolm|eddy|reed|rocko|grandpa|ralph|albert|fred|brian|david|mark|guy|james|aaron|gordon/i;
  var EN_FEMALE = /samantha|zira|jenny|aria|michelle|ava\b|allison|susan|karen|moira|tessa|victoria|google us english|female/i;
  function pickVoice() {
    if (!synth) return;
    var score = function (v) {
      var gb = /^en[-_]GB/i.test(v.lang), male = MALE.test(v.name) && !/female/i.test(v.name);

  // ----- keep the caption bar one height for every step, so nothing below it jumps when the text wraps -----
