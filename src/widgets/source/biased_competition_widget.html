<!doctype html>
<meta charset="utf-8">
<title>Biased Competition</title>
<style>
  :root{
    --bg:#eef0f0;
    --panel:#f8f8f7;
    --ink:#1a1a1a;
    --dim:#6b7280;
    --line:#dcdedd;
    --teal:#1fb3a3;
    --teal-soft:#cdeee9;
    --yellow:#f5d90a;
    --yellow-soft:rgba(245,217,10,0.30);
    --grey-shape:#c9cccb;
    --brain-fill:#f2f2f0;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans)}
  .wrap{max-width:600px;margin:0 auto;padding:22px}
  .head{margin-bottom:14px}
  .head h1{font-size:14px;font-weight:700;margin:0 0 3px}
  .head .sub{font-size:12px;color:var(--dim)}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:6px;
    padding:20px 18px 18px;position:relative}

  svg{display:block;width:100%;height:auto;overflow:visible}
  text{font-family:var(--sans)}
  .stim-label{fill:var(--ink);font-size:11px;font-weight:600;text-anchor:middle}
  .tag{fill:var(--dim);font-size:10px;letter-spacing:.04em}
  .tag.teal{fill:var(--teal);font-weight:600}

  .stim-shape{transition:fill .35s ease}
  .stim-shape.neutral{fill:var(--ink)}
  .stim-shape.attended{fill:var(--ink)}
  .stim-shape.dimmed{fill:var(--grey-shape)}

  .stim-ring{fill:none;stroke:var(--yellow);stroke-width:2.5;opacity:0;transition:opacity .35s ease}
  .stim-ring.on{opacity:1}

  .rf-ellipse{fill:none;stroke:var(--teal);stroke-width:1.75;stroke-dasharray:4 3}
  .screen-bezel{fill:#fdfdfc;stroke:var(--ink);stroke-width:2}
  .screen-stand{fill:#d5d7d6}
  .fix-dot{fill:var(--ink)}

  .brain-outline{fill:var(--brain-fill);stroke:var(--ink);stroke-width:2}
  .fissure{stroke:var(--ink);stroke-width:1.25;opacity:.55}
  .electrode{stroke:#8a8d8c;stroke-width:2}
  .neuron-marker{fill:var(--teal)}

  .feed-line{fill:none;stroke:var(--teal);stroke-width:2;stroke-dasharray:5 6;
    animation:dashmove 1.4s linear infinite;opacity:.8}
  @keyframes dashmove{ to{ stroke-dashoffset:-22; } }

  .cell-circle{fill:#fff;stroke:var(--ink);stroke-width:2.5}
  .cell-glow{fill:var(--yellow-soft);transition:opacity .35s ease}
  .baseline{stroke:var(--ink);stroke-width:1.5;opacity:.5}
  .tick{stroke:var(--ink);stroke-width:2.25;stroke-linecap:round;
    transition:d .4s ease}

  .toggle{display:flex;gap:8px;margin-top:14px;justify-content:center;flex-wrap:wrap}
  .toggle.sub{margin-top:8px}
  .toggle.hidden{display:none}
  .toggle button{background:#fff;border:1.5px solid var(--line);color:var(--ink);
    font-family:var(--sans);font-size:12px;font-weight:600;border-radius:5px;
    padding:8px 14px;cursor:pointer;transition:background .15s,color .15s,border-color .15s}
  .toggle button:hover:not(.active){border-color:var(--teal)}
  .toggle button.active{background:var(--teal);border-color:var(--teal);color:#fff}
</style>

<div class="wrap">
  <div class="head">
    <h1>Biased Competition</h1>
    <div class="sub">Two stimuli, one receptive field — attention decides which one the neuron reports</div>
  </div>

  <div class="card">
    <svg id="chart" viewBox="0 0 480 640"></svg>
    <div class="toggle" id="stimToggle">
      <button data-mode="stim1only">Stim 1 Alone</button>
      <button data-mode="both" class="active">Both Stimuli</button>
      <button data-mode="stim2only">Stim 2 Alone</button>
    </div>
    <div class="toggle sub" id="attendToggle">
      <button data-mode="stim1" class="active">Attend Stim 1</button>
      <button data-mode="stim2">Attend Stim 2</button>
    </div>
  </div>
</div>

<script>
const FIX = {x:225, y:82};
const RF = {x:300, y:85, rx:58, ry:42};
const S1 = {x:280, y:70};
const S2 = {x:322, y:93};
const BRAIN = {x:240, y:300, rx:135, ry:72};
const NEURON = {x:335, y:333};
const CELL = {x:240, y:500, r:58};

let stimMode = 'both';     // 'stim1only' | 'both' | 'stim2only'
let attendMode = 'stim1';  // 'stim1' | 'stim2' — only meaningful when stimMode === 'both'

const els = {
  chart: document.getElementById('chart'),
  stimToggle: document.getElementById('stimToggle'),
  attendToggle: document.getElementById('attendToggle'),
};

els.stimToggle.addEventListener('click', e=>{
  const btn = e.target.closest('button'); if(!btn) return;
  stimMode = btn.dataset.mode;
  [...els.stimToggle.children].forEach(b=>b.classList.toggle('active', b===btn));
  els.attendToggle.classList.toggle('hidden', stimMode!=='both');
  render();
});

els.attendToggle.addEventListener('click', e=>{
  const btn = e.target.closest('button'); if(!btn) return;
  attendMode = btn.dataset.mode;
  [...els.attendToggle.children].forEach(b=>b.classList.toggle('active', b===btn));
  render();
});

function stimShape(cx, cy, kind, cls){
  if(kind===1){
    const s=15;
    return `<path class="stim-shape ${cls}" d="M ${cx} ${cy-s} L ${cx+s} ${cy+s*0.85} L ${cx-s} ${cy+s*0.85} Z"/>`;
  } else {
    const s=12;
    return `<rect class="stim-shape ${cls}" x="${cx-s}" y="${cy-s}" width="${s*2}" height="${s*2}" rx="3"/>`;
  }
}

function ticks(high){
  // Spike amplitude is fixed for a given neuron (all-or-none) — only the RATE
  // changes with which stimulus is driving the cell. Same tick height always;
  // just more of them, spread across the same fixed window, when the strong
  // stimulus (Stim 1) is in control.
  const n = high ? 10 : 4;
  const h = 26;
  const totalW = 80;
  const spacing = totalW/(n-1);
  const baseY = CELL.y + 16;
  let d='';
  for(let i=0;i<n;i++){
    const x = CELL.x - totalW/2 + i*spacing;
    d += `M ${x} ${baseY} L ${x} ${baseY-h} `;
  }
  return d;
}

function screenMarkup(){
  let s='';
  // monitor bezel + stand
  s += `<rect class="screen-bezel" x="95" y="10" width="270" height="150" rx="8"/>`;
  s += `<rect class="screen-stand" x="215" y="160" width="30" height="16"/>`;
  s += `<rect class="screen-stand" x="190" y="176" width="80" height="7" rx="2"/>`;
  // fixation
  s += `<circle class="fix-dot" cx="${FIX.x}" cy="${FIX.y}" r="3"/>`;
  // receptive field ellipse
  s += `<ellipse class="rf-ellipse" cx="${RF.x}" cy="${RF.y}" rx="${RF.rx}" ry="${RF.ry}"/>`;
  s += `<text class="tag teal" x="${RF.x}" y="${RF.y-RF.ry-8}" text-anchor="middle">receptive field</text>`;
  return s;
}

function brainMarkup(){
  let s='';
  s += `<text class="tag" x="${BRAIN.x}" y="${BRAIN.y-BRAIN.ry-14}" text-anchor="middle">macaque cortex, dorsal view</text>`;
  s += `<ellipse class="brain-outline" cx="${BRAIN.x}" cy="${BRAIN.y}" rx="${BRAIN.rx}" ry="${BRAIN.ry}"/>`;
  s += `<line class="fissure" x1="${BRAIN.x}" y1="${BRAIN.y-BRAIN.ry+4}" x2="${BRAIN.x}" y2="${BRAIN.y+BRAIN.ry-4}"/>`;
  // neuron marker (small triangle), teal — matches the receptive-field ellipse color
  s += `<path class="neuron-marker" d="M ${NEURON.x} ${NEURON.y-7} L ${NEURON.x+7} ${NEURON.y+6} L ${NEURON.x-7} ${NEURON.y+6} Z"/>`;
  s += `<text class="tag teal" x="${NEURON.x+12}" y="${NEURON.y+4}">V4</text>`;
  return s;
}

function feedLine(){
  // signal from the recorded neuron down to the response readout
  const x1=NEURON.x, y1=NEURON.y+7, x2=CELL.x, y2=CELL.y-CELL.r-6;
  const mx=(x1+x2)/2, my=(y1+y2)/2;
  return `<path class="feed-line" d="M ${x1} ${y1} Q ${x1} ${my} ${x2} ${y2}"/>`;
}

function render(){
  const showS1 = stimMode==='stim1only' || stimMode==='both';
  const showS2 = stimMode==='stim2only' || stimMode==='both';
  const competing = stimMode==='both';

  // Stim 1 is the strong/effective stimulus for this neuron; Stim 2 is weak —
  // that asymmetry is what makes attention's effect visible at all.
  const s1State = competing ? (attendMode==='stim1' ? 'attended' : 'dimmed') : 'neutral';
  const s2State = competing ? (attendMode==='stim2' ? 'attended' : 'dimmed') : 'neutral';
  const s1Ring = competing && attendMode==='stim1';
  const s2Ring = competing && attendMode==='stim2';

  // which stimulus is effectively "driving" the response right now
  const effectiveStim = stimMode==='stim1only' ? 1
                       : stimMode==='stim2only' ? 2
                       : (attendMode==='stim1' ? 1 : 2);
  const high = effectiveStim===1;

  let svg = '';
  svg += screenMarkup();
  svg += brainMarkup();
  svg += feedLine();

  // stimuli (drawn after screen bezel, inside RF ellipse)
  if(showS1){
    svg += `<circle class="stim-ring ${s1Ring?'on':''}" cx="${S1.x}" cy="${S1.y}" r="20"/>`;
    svg += stimShape(S1.x, S1.y, 1, s1State);
  }
  if(showS2){
    svg += `<circle class="stim-ring ${s2Ring?'on':''}" cx="${S2.x}" cy="${S2.y}" r="18"/>`;
    svg += stimShape(S2.x, S2.y, 2, s2State);
  }

  // response readout
  svg += `<circle class="cell-glow" cx="${CELL.x}" cy="${CELL.y}" r="${CELL.r+10}" opacity="${high?1:0}"/>`;
  svg += `<circle class="cell-circle" cx="${CELL.x}" cy="${CELL.y}" r="${CELL.r}"/>`;
  svg += `<line class="baseline" x1="${CELL.x-40}" y1="${CELL.y+16}" x2="${CELL.x+40}" y2="${CELL.y+16}"/>`;
  svg += `<path class="tick" d="${ticks(high)}"/>`;

  els.chart.innerHTML = svg;
}

render();
</script>
