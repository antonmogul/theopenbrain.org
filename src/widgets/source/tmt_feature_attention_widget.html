<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  :root {
    --bg: #1a1c20;
    --panel-bg: #22252b;
    --magenta: #e8408c;
    --grey-blue: #6f8299;
    --neutral: #9aa0aa;
    --text: #d8dade;
    --dim-text: #8890a0;
    --line: #3a3d44;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    color: var(--text);
    padding: 36px 40px;
    width: 560px;
  }
  .title { font-size: 15px; margin-bottom: 4px; }
  .subtitle { font-size: 11.5px; color: var(--dim-text); margin-bottom: 24px; line-height: 1.5; }

  .toggle {
    display: flex;
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
    margin-bottom: 22px;
  }
  .toggle button {
    flex: 1;
    background: var(--panel-bg);
    color: var(--dim-text);
    border: none;
    border-right: 1px solid var(--line);
    font-family: inherit;
    font-size: 12px;
    padding: 11px 6px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .toggle button:last-child { border-right: none; }
  .toggle button:hover { background: #2a2e35; }
  .toggle button.active {
    background: var(--magenta);
    color: #1a1c20;
    font-weight: 700;
  }

  .panel {
    background: var(--panel-bg);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 20px 22px 24px 22px;
  }
  .panel-sublabel {
    font-size: 11.5px;
    color: var(--dim-text);
    text-align: center;
    margin-bottom: 6px;
    min-height: 32px;
    line-height: 1.4;
    transition: opacity 0.15s;
  }
  .schematic { width: 100%; height: 170px; display: block; }
  .raster-area {
    margin-top: 24px;
    background: #16181c;
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 10px 8px 6px 8px;
  }
  .raster-svg { display: block; width: 100%; }
  .axis-label {
    font-size: 9.5px;
    color: var(--dim-text);
    text-align: center;
    margin-top: 8px;
  }
  .fade { transition: opacity 0.18s ease; }
</style>
</head>

const sublabels = {
  fixation: "neither stimulus behaviourally relevant",
  preferred: "attended target is outside the RF, moving in the cell's preferred direction",
  null: "attended target is outside the RF, moving in the cell's anti-preferred direction"
};

function setCondition(cond) {
  document.querySelectorAll('.toggle button').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + cond).classList.add('active');

  const schematicEl = document.getElementById('schematic');
  const rasterEl = document.getElementById('raster');
  const sublabelEl = document.getElementById('sublabel');

  [schematicEl, rasterEl, sublabelEl].forEach(el => el.style.opacity = 0);

  setTimeout(() => {
    // remove old dynamic content (keep defs in schematic)
    const defs = schematicEl.querySelector('defs');
    schematicEl.innerHTML = schematics[cond] + (defs ? defs.outerHTML : '');
    rasterEl.innerHTML = rasters[cond];
    sublabelEl.textContent = sublabels[cond];
    [schematicEl, rasterEl, sublabelEl].forEach(el => el.style.opacity = 1);
  }, 180);
}
